# DTL mTLS test lab — two server blocks:
#   :8443  ssl_verify_client on       (designated domain  — MUST present client cert)
#   :8444  ssl_verify_client optional (non-designated     — no cert returns verify=NONE)
# Both echo $ssl_client_verify and $ssl_client_s_dn so curl output proves what happened.

server {
    listen 8443 ssl;
    server_name localhost;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_client_certificate /etc/nginx/certs/ca.pem;
    ssl_verify_client on;

    location / {
        default_type text/plain;
        return 200 "verify=$ssl_client_verify subject=$ssl_client_s_dn";
    }
}

server {
    listen 8444 ssl;
    server_name localhost;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_client_certificate /etc/nginx/certs/ca.pem;
    ssl_verify_client optional;

    location / {
        default_type text/plain;
        return 200 "verify=$ssl_client_verify subject=$ssl_client_s_dn";
    }
}
