# DTL mTLS test lab — three server blocks:
#   :8443  ssl_verify_client on       (tool-1, designated domain — MUST present client cert)
#   :8445  ssl_verify_client on + CN gate (tool-2 — cert accepted but this device's CN is not on
#          the approved list, so it is ALWAYS 403; one direction only, no toggle)
#   :8444  ssl_verify_client optional (non-designated     — no cert returns verify=NONE)
# All three echo $ssl_client_verify / $ssl_client_s_dn (as body text or an HTML comment) so curl
# output proves what happened — kept even after the M1b HTML page swap so the documented curl
# regression checks (lab/README.md) still work with `grep verify=`.
# /nav on :8443 serves a navigation-test page for M1 Step 2 verification.

server {
    listen 8443 ssl;
    server_name localhost;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_client_certificate /etc/nginx/certs/ca.pem;
    ssl_verify_client on;

    # M1b — static "tool-1" success page (Appendix C). The verify=/subject= line is kept as an
    # HTML comment (nginx substitutes the real variables) so `curl ... | grep verify=` still
    # proves the handshake succeeded, exactly like the old plain-text body did.
    location / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>tool-1</title>
<style>
:root{
  --surface-2:#ffffff; --surface-1:#f6f5f1;
  --border:#e5e3da; --border-strong:#d0cec4;
  --text-primary:#1c1c1a; --text-secondary:#5f5e59; --text-muted:#8b8a82;
  --bg-accent:#e6f1fb;  --text-accent:#185fa5;
  --bg-success:#e7f4ea; --text-success:#1b7f4b;
  --bg-danger:#fcebeb;  --text-danger:#a32d2d;
  --bg-warning:#faeeda; --text-warning:#8a5209;
  --radius:8px;
  --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
body{font-family:var(--font-sans);color:var(--text-primary);margin:0;background:var(--surface-1)}
</style>
</head><body>
<!-- verify=$ssl_client_verify subject=$ssl_client_s_dn -->
<div style="padding:1.25rem 1.5rem 1.75rem;font-family:var(--font-sans)">
  <div style="display:flex;align-items:center;gap:8px;background:var(--bg-success);color:var(--text-success);padding:8px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:1.25rem">
    Secure connection &mdash; mutual TLS handshake succeeded with this device&#39;s certificate.
  </div>
  <div style="font-size:18px;font-weight:500;margin-bottom:2px">tool-1</div>
  <div style="font-size:13px;color:var(--text-secondary);margin-bottom:1.25rem">Internal service (placeholder content).</div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:1.25rem">
    <div style="background:var(--surface-1);border-radius:var(--radius);padding:14px 16px"><div style="font-size:13px;color:var(--text-secondary)">Metric A</div><div style="font-size:24px;font-weight:500;margin-top:4px">42</div></div>
    <div style="background:var(--surface-1);border-radius:var(--radius);padding:14px 16px"><div style="font-size:13px;color:var(--text-secondary)">Metric B</div><div style="font-size:24px;font-weight:500;margin-top:4px;color:var(--text-success)">+2.4%</div></div>
    <div style="background:var(--surface-1);border-radius:var(--radius);padding:14px 16px"><div style="font-size:13px;color:var(--text-secondary)">Metric C</div><div style="font-size:24px;font-weight:500;margin-top:4px">63%</div></div>
  </div>
  <a href="https://market-data.example.com" style="font-size:13px;color:var(--text-accent)">Open external market data &#8599;</a>
</div>
</body></html>';
    }

    location /nav {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Nav Test</title></head><body><p>mTLS: verify=$ssl_client_verify subject=$ssl_client_s_dn</p><ul><li><a href="/nav">Same-host (allow)</a></li><li><a href="https://localhost:8444/">Non-designated :8444 (block)</a></li><li><a href="https://example.com/">example.com (block)</a></li><li><a href="https://localhost:8443/nav" target="_blank">Same-host _blank (load in-window)</a></li></ul></body></html>';
    }
}

server {
    # M1b — tool-2: cert IS presented and accepted at the TLS layer (ssl_verify_client on), but
    # the approved-CN gate below always rejects this device with 403. One direction only, no
    # both-ways toggle — CN=DTL-Approved-Device never matches the
    # provisioned test cert (CN=DTL-Ubuntu-Test-Device), so no new cert is needed for this demo.
    listen 8445 ssl;
    server_name localhost;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_client_certificate /etc/nginx/certs/ca.pem;
    ssl_verify_client on;

    location / {
        default_type text/plain;

        if ($ssl_client_verify != SUCCESS) {
            return 400 "verify=$ssl_client_verify subject=$ssl_client_s_dn";
        }
        if ($ssl_client_s_dn !~ "CN=DTL-Approved-Device") {
            return 403 "verify=$ssl_client_verify subject=$ssl_client_s_dn — device not approved for tool-2";
        }
        return 200 "verify=$ssl_client_verify subject=$ssl_client_s_dn";
    }
}

server {
    listen 8444 ssl;
    server_name localhost;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_client_certificate /etc/nginx/certs/ca.pem;
    ssl_verify_client optional;

    location / {
        default_type text/plain;
        return 200 "verify=$ssl_client_verify subject=$ssl_client_s_dn";
    }

    # M3 kill-switch control plane (D-M3-9).
    # Serves a static signed kill-command JSON file (no mTLS required — client cert
    # is irrelevant here; the Ed25519 signature is the trust mechanism, not TLS auth).
    # Swap kill-command.json between kill-none.json and kill-wipe.json to toggle state.
    # Cache-Control: no-store prevents any downstream caching of the active command.
    location = /kill {
        alias /etc/nginx/kill/kill-command.json;
        default_type application/json;
        add_header Cache-Control no-store;
    }
}
