<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DTL App — managed enterprise browser PoC" />
    <meta name="keywords" content="DTL, enterprise, browser, kiosk" />
    <title>DTL App</title>
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'unsafe-inline'" />
    <style>
      :root {
        --surface-2: #ffffff; --surface-1: #f6f5f1;
        --border: #e5e3da;
        --text-primary: #1c1c1a; --text-secondary: #5f5e59; --text-muted: #8b8a82;
        --bg-accent: #e6f1fb;  --text-accent: #185fa5;
        --bg-success: #e7f4ea; --text-success: #1b7f4b;
        --bg-danger: #fcebeb;  --text-danger: #a32d2d;
        --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; font-family: var(--font-sans); }
      #chrome-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        height: 100%;
        padding: 0 16px;
        border-bottom: 0.5px solid var(--border);
        background: var(--surface-1);
        user-select: none;
        -webkit-app-region: drag;
      }
      #chrome-bar button, #chrome-bar .pill, #identity { -webkit-app-region: no-drag; }
      .left { display: flex; align-items: center; gap: 10px; }
      .right { display: flex; align-items: center; gap: 12px; }
      #back-btn {
        display: none;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-secondary);
        padding: 4px;
      }
      #back-btn.visible { display: flex; }
      #logo { height: 26px; width: auto; display: block; }
      #chrome-title { font-weight: 500; font-size: 15px; color: var(--text-primary); }
      #chrome-subtitle { font-size: 11px; color: var(--text-muted); }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        padding: 3px 9px;
        border-radius: 999px;
      }
      #badge.neutral { background: var(--surface-2); color: var(--text-secondary); border: 0.5px solid var(--border); }
      #badge.green   { background: var(--bg-success); color: var(--text-success); }
      #badge.red     { background: var(--bg-danger);  color: var(--text-danger); }
      #identity { display: flex; align-items: center; gap: 8px; }
      #avatar {
        width: 30px; height: 30px;
        border-radius: 50%;
        background: var(--bg-accent);
        color: var(--text-accent);
        display: flex; align-items: center; justify-content: center;
        font-weight: 500; font-size: 12px;
      }
      #identity-text { line-height: 1.3; }
      #identity-email { font-size: 12px; color: var(--text-primary); }
      #identity-cn { font-size: 11px; color: var(--text-muted); }
    </style>
  </head>
  <body>
    <div id="chrome-bar">
      <div class="left">
        <button id="back-btn" aria-label="Back to home" title="Back to home">
          <svg viewBox="0 0 24 24"
               width="18"
               height="18"
               fill="none"
               stroke="currentColor"
               stroke-width="2"
               stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M5 12h14M5 12l6-6M5 12l6 6" />
          </svg>
        </button>
        <img id="logo" alt="DTL" height="26" width="26" />
        <div>
          <div id="chrome-title">DTL App</div>
          <div id="chrome-subtitle">Managed workspace</div>
        </div>
      </div>
      <div class="right">
        <span id="badge" class="pill neutral">
          <span id="badge-icon"></span>
          <span id="badge-label">Managed device</span>
        </span>
        <div id="identity">
          <div id="avatar">--</div>
          <div id="identity-text">
            <div id="identity-email">—</div>
            <div id="identity-cn">—</div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
