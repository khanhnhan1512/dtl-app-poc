<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="description" content="DTL App - access denied">
    <meta name="keywords" content="DTL, enterprise, browser, kiosk">
    <title>Access denied - DTL App</title>
    <link rel="stylesheet" href="./tokens.css">
  </head>
  <body>
    <div style="padding:3rem 1.5rem;
                display:flex;
                flex-direction:column;
                align-items:center;
                text-align:center">
      <div style="width:56px;
                  height:56px;
                  border-radius:50%;
                  background:var(--bg-danger);
                  color:var(--text-danger);
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  margin-bottom:1rem">
        <svg viewBox="0 0 24 24"
             width="28"
             height="28"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">
          <path d="M12 3l7 3v6c0 5-3.5 7.5-7 9-3.5-1.5-7-4-7-9V6l7-3z" />
          <path d="M9.5 9.5l5 5M14.5 9.5l-5 5" />
        </svg>
      </div>
      <div style="font-size:18px;font-weight:500;margin-bottom:6px">Access denied</div>
      <div id="message-line"
           style="font-size:14px;
                  color:var(--text-secondary);
                  line-height:1.6;
                  max-width:440px;
                  margin-bottom:1.25rem">
        This device isn't authorized for this tool. The internal service accepted the connection but refused this device's certificate.
      </div>
      <div style="display:flex;
                  align-items:center;
                  gap:8px;
                  background:var(--surface-1);
                  border:0.5px solid var(--border);
                  border-radius:var(--radius);
                  padding:8px 12px;
                  font-size:12px;
                  color:var(--text-secondary);
                  font-family:var(--font-mono);
                  margin-bottom:1.25rem">
        <svg viewBox="0 0 24 24"
             width="15"
             height="15"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="6" rx="1" /><rect x="3" y="14" width="18" height="6" rx="1" />
          <path d="M7 7h.01M7 17h.01M3 3l18 18" />
        </svg>
        <span id="code-line">HTTP - this device is not on the tool's approved list</span>
      </div>
      <div id="recovery-line"
           style="font-size:13px;
                  color:var(--text-muted);
                  max-width:440px;
                  line-height:1.6">Contact DTL IT if you believe this device should have access to this tool.</div>
    </div>
    <script>
  var code = new URLSearchParams(location.search).get('code') || '?'
  var messageEl = document.getElementById('message-line')
  var codeEl = document.getElementById('code-line')
  var recoveryEl = document.getElementById('recovery-line')

  if (code === '403') {
    messageEl.textContent =
      "This device isn't authorized for this tool. The internal service accepted the connection but refused this device's certificate."
    codeEl.textContent = 'HTTP 403' + " - this device is not on the tool's approved list"
    recoveryEl.textContent = 'Contact DTL IT if you believe this device should have access to this tool.'
  } else if (code === '400') {
    messageEl.textContent =
      'This device has no certificate to present. It may have been wiped remotely, or it was never provisioned.'
    codeEl.textContent = 'HTTP 400 - no device certificate presented'
    recoveryEl.textContent = 'Contact DTL IT to re-provision the device.'
  } else {
    messageEl.textContent = 'This tool refused the connection.'
    codeEl.textContent = 'HTTP ' + code + ' - connection refused'
    recoveryEl.textContent = 'Contact DTL IT if this continues.'
  }
    </script>
  </body>
</html>
