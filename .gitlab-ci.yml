stages:
  - lint
  - release

auto_lint:
  stage: lint
  image: registry.dtl/eng/lint.dtl/cli:latest
  tags:
    - sg
  script:
    - pandora login --ci
    - lint --check

release_macos:
  stage: release
  only:
    refs:
      - tags
  tags:
    - mac
  script:
    - make release-macos

release_linux:
  stage: release
  only:
    refs:
      - tags
  tags:
    - sg
  image: node:22-bookworm
  script:
    - make release-linux
